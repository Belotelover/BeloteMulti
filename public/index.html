<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e4425">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icone-192.png">
<link rel="apple-touch-icon" href="/icons/icone-180.png">
<meta name="apple-mobile-web-app-title" content="Belote du Gang">
<title>Belote du Gang</title>
<style>
  :root{
    --wood1:#e8bb6e; --wood2:#c8923f; --wood-dark:#5b3a1a;
    --felt1:#1f7a45; --felt2:#0e4425;
    --gold1:#e9bd72; --gold2:#c8923f; --gold-border:#5b3a1a;
    --ink:#2a1a08;
    --back:#a8202a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'Segoe UI',Arial,sans-serif;background:#000;overflow:hidden;}
  #app{position:relative;width:100%;height:100%;height:100dvh;max-width:520px;margin:0 auto;background:radial-gradient(ellipse at center, var(--felt1), var(--felt2));display:flex;flex-direction:column;}

  header{
    background:linear-gradient(180deg,var(--wood1),var(--wood2));
    border-bottom:3px solid var(--wood-dark);
    text-align:center;padding:14px 10px;flex-shrink:0;
    box-shadow:0 3px 8px rgba(0,0,0,.4);
  }
  header h1{margin:0;font-size:28px;letter-spacing:1px;color:var(--wood-dark);text-shadow:0 1px 0 rgba(255,255,255,.3);font-weight:800;}

  .hud{position:sticky;top:0;left:0;right:0;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,.3));padding:7px 12px 8px;z-index:8;margin:-8px -8px 0;}
  .hud-scores{display:flex;justify-content:space-between;align-items:baseline;}
  .hud-scores .team{font-size:13px;font-weight:800;text-shadow:0 1px 2px #000;}
  .hud-scores .nous{color:#bfe6c9;}
  .hud-scores .eux{color:#f3c1c1;}
  .hud-scores .team small{font-weight:400;opacity:.85;font-size:10.5px;}
  .hud-round{margin-top:4px;text-align:center;font-size:11.5px;color:#f4d99a;text-shadow:0 1px 2px #000;}

  .table{flex:1;position:relative;padding:8px;overflow-y:auto;overflow-x:hidden;}

  .hand-row{display:flex;justify-content:center;}
  /* mains adverses : elles aussi en eventail, sinon la table parait incoherente
     (les cartes sont placees une par une, comme la main du bas) */
  .top-hand{position:absolute;top:180px;left:50%;width:0;height:0;z-index:3;isolation:isolate;}
  .left-hand{position:absolute;top:50%;left:44px;width:0;height:0;z-index:3;isolation:isolate;}
  .right-hand{position:absolute;top:50%;right:44px;width:0;height:0;z-index:3;isolation:isolate;}
  /* Main en eventail, TOUJOURS sur une seule ligne : chaque carte est placee
     individuellement (rotation + hauteur), l'ecartement reste identique quel que soit
     le nombre de cartes restantes — la main se resserre, elle ne s'etale pas. */
  .bottom-hand{position:absolute;bottom:14px;left:0;right:0;height:112px;z-index:4;isolation:isolate;}
  .bottom-hand .card{position:absolute;transform-origin:50% 135%;}

  .mini-card{position:absolute;width:50px;height:72px;border:1.5px solid #fff;border-radius:6px;box-shadow:0 2px 5px rgba(0,0,0,.55);
    background-color:var(--back);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 1px, transparent 1px 5px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.55) 0 1px, transparent 1px 5px);
    background-clip:padding-box;}

  .center-area{position:absolute;top:54%;left:50%;transform:translate(-50%,-50%);display:flex;gap:16px;align-items:center;justify-content:center;min-height:110px;}

  .trick-area{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);width:216px;height:224px;z-index:5;}
  .trick-slot{position:absolute;width:68px;height:100px;}
  /* les cartes jouées au centre sont plus grandes : c'est l'information la plus regardée */
  .trick-slot .card{width:68px;height:100px;padding:4px 5px;}
  .trick-slot .card .r1, .trick-slot .card .r2{font-size:16px;}
  .trick-slot .card .suit-big{font-size:29px;}
  /* Animations du pli. Elles portent sur la CARTE, jamais sur le slot : le slot utilise
     deja un transform pour se centrer, l'animer casserait le placement.
     --dx/--dy sont poses en JS selon le siege concerne. */
  @keyframes carteArrive{ from{ transform:translate(var(--dx),var(--dy)) scale(.85); opacity:.25; } }
  /* Ramassage en deux temps : les 4 cartes se REGROUPENT d'abord en tas au centre
     (--cx/--cy ramenent chaque carte depuis sa place vers le milieu, --rot donne le
     desordre d'un vrai tas), puis le tas file vers le gagnant (--wx/--wy). */
  @keyframes carteRamassee{
    0%{   transform:translate(0,0) scale(1) rotate(0deg); }
    38%{  transform:translate(var(--cx),var(--cy)) scale(.94) rotate(var(--rot)); opacity:1; }
    100%{ transform:translate(calc(var(--cx) + var(--wx)), calc(var(--cy) + var(--wy)))
                    scale(.48) rotate(var(--rot)); opacity:0; }
  }
  .trick-slot .card.posee{ animation:carteArrive .19s cubic-bezier(.2,.85,.3,1); }
  .trick-slot .card.ramassee{ animation:carteRamassee var(--duree,450ms) cubic-bezier(.45,0,.85,.35) forwards; }
  @media (prefers-reduced-motion: reduce){
    .trick-slot .card.posee, .trick-slot .card.ramassee{ animation:none; }
  }
  .slot-bottom{bottom:0;left:50%;transform:translateX(-50%);}
  .slot-top{top:0;left:50%;transform:translateX(-50%);}
  .slot-left{left:0;top:50%;transform:translateY(-50%);}
  .slot-right{right:0;top:50%;transform:translateY(-50%);}

  .card{width:52px;height:76px;background:#fdfcf6;border-radius:6px;border:1px solid #333;box-shadow:0 2px 5px rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;font-weight:700;position:relative;user-select:none;}
  .card .r1{font-size:13px;line-height:1;}
  .card .suit-big{font-size:22px;align-self:center;}
  .card .r2{font-size:13px;line-height:1;align-self:flex-end;transform:rotate(180deg);}
  .suit-h{color:#c1272d;}
  .suit-d{color:#1a63c9;}
  .suit-c{color:#1c7a3e;}
  .suit-s{color:#111;}

  .bottom-hand .card{width:78px;height:112px;transition:transform .15s, box-shadow .15s;cursor:pointer;}
  /* Rangee d'accueil des cartes recues apres la prise : elles restent en evidence le temps
     de les voir, puis viennent se ranger dans la main (animation FLIP dans render). */
  /* liste des parties en cours sur l'ecran d'accueil */
  .rooms{width:100%;max-width:320px;margin:14px auto 0;text-align:left;}
  .rooms h3{margin:0 0 8px;font-size:13px;color:#f4d99a;text-align:center;font-weight:700;}
  .room-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.28);border-radius:12px;
    padding:9px 12px;margin-bottom:8px;cursor:pointer;color:#eaf3ec;}
  .room-row:hover{border-color:#f4d99a;}
  .room-row .who{font-size:12.5px;font-weight:700;line-height:1.3;}
  .room-row .who small{display:block;font-weight:400;opacity:.75;font-size:11px;}
  .room-row .tag{font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:10px;white-space:nowrap;}
  .tag-live{background:#8d2230;color:#fff;}
  .tag-wait{background:var(--felt1);color:#dff3e6;}
  .tag-back{background:var(--gold2);color:var(--ink);}
  .rooms .empty{font-size:12px;color:#a9c7b4;text-align:center;padding:6px 0;}
  .hud-notice{color:#f4d99a;font-weight:700;animation:noticeIn .35s ease-out;}
  @keyframes noticeIn{ from{ opacity:0; transform:translateY(-4px); } }
  /* meme liseré doré que les cartes qui viennent d'arriver : on reste coherent */
  .seat-mine{box-shadow:0 0 0 2px #f4d99a, 0 4px 14px rgba(0,0,0,.55);}
  .watch-badge{position:absolute;top:112px;left:50%;transform:translateX(-50%);z-index:9;
    background:rgba(0,0,0,.55);border:1px solid rgba(244,217,154,.45);color:#f4d99a;
    padding:5px 12px;border-radius:14px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  /* Distribution : les cartes partent du talon, au centre, vers chaque joueur.
     Cette couche vit HORS de #root, sinon chaque redessin l'effacerait en plein vol. */
  #couche-donne{position:fixed;inset:0;pointer-events:none;z-index:30;}
  #couche-donne .talon-centre{position:absolute;width:52px;height:76px;border-radius:6px;
    border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.55);
    background-color:var(--back);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.5) 0 1.5px, transparent 1.5px 7px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.5) 0 1.5px, transparent 1.5px 7px);
    transform:translate(-50%,-50%);transition:opacity .25s;}
  #couche-donne .vol{position:absolute;width:66px;height:96px;border-radius:6px;border:2px solid #fff;
    background-color:var(--back);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.5) 0 1.5px, transparent 1.5px 6px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.5) 0 1.5px, transparent 1.5px 6px);
    transform:translate(-50%,-50%) scale(.8);
    box-shadow:0 3px 8px rgba(0,0,0,.5);
    transition:transform 368ms cubic-bezier(.25,.8,.35,1), opacity 180ms;}
  .new-row{position:absolute;bottom:118px;left:0;right:0;display:flex;justify-content:center;
    gap:0;z-index:5;pointer-events:none;}
  .new-row .card{width:66px;height:96px;margin:0 -9px;}
  .card.fresh{box-shadow:0 0 0 2px #f4d99a, 0 4px 14px rgba(0,0,0,.55);}
  .card.arriving{animation:cardArrive .20s cubic-bezier(.2,.85,.3,1) backwards;}
  @keyframes cardArrive{ from{ transform:translateY(-40px) scale(.9); opacity:0; } }
  @media (prefers-reduced-motion: reduce){
    .card.arriving{animation:none;}
  }
  .bottom-hand .card .r1, .bottom-hand .card .r2{font-size:16px;}
  .bottom-hand .card .suit-big{font-size:27px;}
  .bottom-hand .card:hover{box-shadow:0 8px 18px rgba(0,0,0,.7);z-index:99;}
  .bottom-hand .card.disabled{filter:brightness(.6) saturate(.4);cursor:not-allowed;}
  .bottom-hand .card.disabled:hover{transform:none;}

  .wm-bottom{top:71%;left:50%;}   /* devant nous, sous le pli et au-dessus de notre main */
  .wm-top{top:28%;left:50%;}
  .wm-left{top:52%;left:27%;}
  .wm-right{top:52%;left:73%;}
  .talon-back{width:66px;height:96px;border-radius:6px;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.5);
    background-color:var(--back);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 1.5px, transparent 1.5px 7px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.55) 0 1.5px, transparent 1.5px 7px);
    background-clip:padding-box;}

  .gold-btn{background:linear-gradient(180deg,var(--gold1),var(--gold2));border:2px solid var(--gold-border);border-radius:24px;color:var(--ink);font-weight:700;padding:12px 22px;font-size:15px;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.4);}
  .gold-btn:active{transform:translateY(1px);}
  .gold-btn:disabled{opacity:.5;cursor:default;}

  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;}
  .bid-panel-wrap{position:absolute;top:190px;left:50%;transform:translateX(-50%);z-index:20;width:90%;max-width:340px;}
  /* Encheres : place au CENTRE BAS, juste au-dessus de la main et sous la retourne.
     Auparavant collee tout en haut, loin du regard et du pouce : on lisait la retourne au
     milieu, puis il fallait remonter a l'autre bout de l'ecran pour repondre. */
  .bid-bar{position:absolute;bottom:150px;left:8px;right:8px;z-index:20;
    background:rgba(18,13,7,.94);border:2px solid var(--gold-border);border-radius:14px;
    box-shadow:0 6px 16px rgba(0,0,0,.55);padding:9px 10px;display:flex;flex-wrap:wrap;
    align-items:center;justify-content:center;gap:8px;}
  .bid-bar .bid-text{color:#f4d99a;font-size:12.5px;font-weight:700;text-shadow:0 1px 2px #000;flex-basis:100%;text-align:center;}
  .gold-btn.small{padding:7px 14px;font-size:13px;}
  .deal-choice-bar{position:absolute;top:56px;left:0;right:0;z-index:20;background:rgba(18,13,7,.92);border-bottom:2px solid var(--gold-border);box-shadow:0 4px 10px rgba(0,0,0,.5);padding:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;}
  .suit-btn{width:40px;height:40px;font-size:20px;border-radius:8px;border:2px solid var(--gold-border);background:#fdfcf6;cursor:pointer;}
  .panel{background:linear-gradient(180deg,var(--felt1),var(--felt2));border:2px solid var(--gold-border);border-radius:14px;padding:22px;max-width:340px;width:88%;text-align:center;color:#f4f4f4;box-shadow:0 10px 30px rgba(0,0,0,.6);}
  .panel h2{margin-top:0;color:#f4d99a;font-size:20px;}
  .panel .btn-row{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  .suit-pick{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .suit-pick button{width:52px;height:52px;font-size:24px;border-radius:10px;border:2px solid var(--gold-border);background:#fdfcf6;cursor:pointer;}

  /* la retourne merite la meme taille que les cartes en main : c'est l'information la plus
     regardee de la phase d'encheres (cet agrandissement avait ete perdu lors d'un retour
     a une version anterieure) */
  .turned-lg{width:66px;height:96px;}
  .turned-lg .r1, .turned-lg .r2{font-size:16px;}
  .turned-lg .suit-big{font-size:27px;}
  @keyframes revelation{ from{ transform:rotateY(90deg) scale(.92); opacity:.35; } }
  .turned-lg.revele{ animation:revelation .30s ease-out; }
  /* Belote / Rebelote : moment fort, il passait inapercu */
  @keyframes eclatBelote{ 0%,100%{ box-shadow:none; } 50%{ box-shadow:0 0 14px 4px rgba(244,217,154,.9); } }
  .banner.belote{ animation:eclatBelote 1.1s ease-in-out 2; }
  .card-lg{width:78px;height:114px;margin:10px auto;}
  .card-lg .r1, .card-lg .r2{font-size:18px;}
  .card-lg .suit-big{font-size:34px;}

  .banner{position:absolute;top:210px;left:50%;transform:translate(-50%,0);background:rgba(0,0,0,.65);color:#f4d99a;padding:6px 14px;border-radius:8px;font-size:13px;z-index:15;pointer-events:none;text-align:center;max-width:80%;}

  .home-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;}
  .home-screen p{color:#dfeee2;text-align:center;font-size:13px;max-width:320px;}

  .dealer-badge{position:absolute;width:26px;height:26px;border-radius:50%;background:#c1272d;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.5);z-index:7;}
  /* L'atout est signale par ce seul filigrane : agrandi et plus contraste, il remplace
     le jeton qui se posait sur les cartes et en cachait une. */
  /* Filigrane : imprime sur le tapis, donc DERRIERE toutes les cartes (z-index 0 ; les
     cartes et les mains sont a 3 ou plus). Avant il passait devant et mordait sur elles. */
  /* Le filigrane se place DEVANT LE PRENEUR : sa position dit d'un coup d'oeil qui a pris,
     sans avoir a relire le bandeau. Il reste imprime sur le tapis (z-index 0, derriere
     toutes les cartes). */
  .trump-watermark{position:absolute;z-index:0;transform:translate(-50%,-50%);
    font-size:132px;line-height:1;opacity:.30;
    pointer-events:none;font-weight:800;
    text-shadow:0 2px 10px rgba(0,0,0,.35);}
  .icon-btn{position:absolute;z-index:9;width:36px;height:36px;border-radius:50%;
    background:linear-gradient(180deg,var(--gold1),var(--gold2));border:2px solid var(--gold-border);
    color:var(--ink);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.4);}
  .ib-l1{top:112px;left:8px;}
  .ib-l2{top:156px;left:8px;}
  .ib-r1{top:112px;right:8px;}
  .ib-l3{top:200px;left:8px;}  /* 3e bouton a gauche : prendre une chaise (mode spectateur) */
  .ib-r2{top:156px;right:8px;}
  .cross-wrap{position:relative;width:200px;height:210px;margin:10px auto;}
  .cross-slot{position:absolute;width:56px;text-align:center;}
  .cross-slot .who{font-size:9.5px;color:#f4d99a;margin-bottom:2px;}
  .cross-bottom{bottom:0;left:50%;transform:translateX(-50%);}
  .cross-top{top:0;left:50%;transform:translateX(-50%);}
  .cross-left{left:0;top:50%;transform:translateY(-50%);}
  .cross-right{right:0;top:50%;transform:translateY(-50%);}
  .bubble{position:absolute;z-index:16;max-width:130px;background:#fdfcf6;color:#1a1a1a;font-size:11.5px;
    font-weight:600;padding:5px 9px;border-radius:11px;box-shadow:0 3px 8px rgba(0,0,0,.5);
    border:1px solid #b9a97e;line-height:1.25;}
  .bub-bottom{bottom:150px;left:calc(50% - 150px);}
  .bub-right{top:calc(50% + 34px);right:8px;}
  .bub-top{top:196px;left:calc(50% + 26px);}
  .bub-left{top:calc(50% + 34px);left:8px;}
  .chat-bar{position:absolute;bottom:96px;left:8px;right:8px;z-index:19;background:rgba(18,13,7,.94);
    border:2px solid var(--gold-border);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;
    gap:6px;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.5);}
  .chat-bar button{background:#fdfcf6;border:1px solid #b9a97e;border-radius:14px;padding:6px 10px;
    font-size:12px;font-weight:600;cursor:pointer;color:#1a1a1a;}

  .theme-toast{position:absolute;top:104px;left:50%;transform:translateX(-50%);z-index:22;
    background:rgba(0,0,0,.78);color:#fff;font-size:12.5px;font-weight:700;padding:6px 14px;
    border-radius:14px;border:1px solid rgba(255,255,255,.28);pointer-events:none;white-space:nowrap;}

  .bid-mark{position:absolute;z-index:9;font-size:11px;font-weight:800;padding:2px 7px;border-radius:9px;
    background:rgba(0,0,0,.62);color:#cfd8d0;border:1px solid rgba(255,255,255,.25);white-space:nowrap;}
  .bid-mark.takes{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#111;border-color:var(--gold-border);}
  .bid-mark.turn{background:#2e7d46;color:#fff;border-color:#9fe0b4;}
  .bm-top{top:108px;left:calc(50% + 38px);}
  .bm-left{top:calc(50% - 80px);left:6px;}
  .bm-right{top:calc(50% - 80px);right:6px;}
  .bm-bottom{bottom:98px;left:calc(50% + 38px);}

  /* le joueur dont c'est le tour respire doucement : a 4 sur mobile, on cherche parfois
     qui doit jouer. Utile autant qu'immersif. */
  @keyframes tourDeJeu{ 50%{ box-shadow:0 0 0 3px rgba(244,217,154,.75); background:rgba(0,0,0,.6); } }
  .bot-label.a-lui{ animation:tourDeJeu 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .bot-label.a-lui{ animation:none; box-shadow:0 0 0 2px #f4d99a; } }
  .bot-label{position:absolute;font-size:10.5px;color:#f4d99a;text-shadow:0 1px 2px #000;z-index:6;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:6px;white-space:nowrap;}
  .label-top{top:108px;left:50%;transform:translateX(-50%);}
  /* hors plein ecran, la fenetre est plus courte : un simple pourcentage faisait remonter
     les pseudos derriere les boutons ronds. On impose donc un plancher. */
  .label-left{top:max(206px, calc(50% - 148px));left:4px;}
  .label-right{top:max(206px, calc(50% - 148px));right:4px;}
  .dealer-bottom{bottom:60px;left:calc(50% - 90px);}
  .dealer-right{top:50%;right:36px;transform:translateY(-50%);}
  .dealer-top{top:188px;left:calc(50% - 90px);}
  .dealer-left{top:50%;left:36px;transform:translateY(-50%);}

  .newgame-btn{position:absolute;bottom:10px;right:10px;z-index:6;}
  footer-note{}

/* le client multi reutilise .blk pour le noir */
.blk{color:#1a1a1a;}
</style>
</head>
<body>
<div id="app">
  <header><h1>Belote du Gang</h1></header>
  <div id="root" class="table"></div>
</div>
<script>
// ============================================================================
// Client multijoueur : ne contient AUCUNE regle du jeu. Il recoit une vue (V)
// du serveur, la dessine, et envoie des intentions. Impossible de tricher :
// les cartes des autres ne sont jamais transmises.
// ============================================================================
let ws=null, V=null, PLAYERS=null, ME=-1, CODE=null, TOKEN=null, STARTED=false;
let clientToast=null;

// ---------- AMBIANCES (client uniquement, aucune regle du jeu ici) ----------
const THEMES = [
  {name:'Classique', vars:{}},

let themeIndex = 0;
function applyTheme(){
  const el=document.documentElement; if(!el||!el.style) return;
  const vars=Object.assign({}, DEFAULT_VARS, THEMES[themeIndex].vars);
  for(const k in vars) el.style.setProperty(k, vars[k]);
}
function clientToastShow(msg, ms){
  clientToast=msg; render();
  setTimeout(()=>{ if(clientToast===msg){ clientToast=null; render(); } }, ms||1500);
}
function cycleTheme(){
  themeIndex=(themeIndex+1)%THEMES.length;
  applyTheme();
  clientToastShow(THEMES[themeIndex].name);
}

function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFullscreen(){
  const el=document.documentElement; if(!el) return;
  if(isFullscreen()){ const exit=document.exitFullscreen||document.webkitExitFullscreen; if(exit) exit.call(document); return; }
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req){ clientToastShow("Ajoutez le jeu à l'écran d'accueil pour le plein écran", 2800); return; }
  const r=req.call(el);
  if(r && r.catch) r.catch(()=>clientToastShow('Plein écran refusé par le navigateur', 2200));
}

function screenSlot(seat){
  const base = ME<0 ? 0 : ME;   // spectateur : on regarde la table depuis le siege 0
  const d=(seat-base+4)%4;      // 0 moi
  return ['bottom','right','top','left'][d===0?0: d===1?1: d===2?2:3];
}

// ---------- arrivee des cartes apres la prise ----------
// Quand la main GRANDIT (5 -> 8 cartes apres la prise), les nouvelles cartes s'affichent
// d'abord sur une rangee au-dessus, le temps de les voir, puis se rangent dans la main.
// On identifie les cartes par leur id (pas par leur element) car le client redessine tout
// l'ecran a chaque message du serveur : les elements sont recrees, les ids non.
let handIds=[];        // ids de ma main au rendu precedent
let freshIds=[];       // cartes en cours d'affichage sur la rangee du dessus
let freshTimer=null;
let WATCHING=false;    // je regarde la partie sans y jouer (aucun siege)
// Animations du pli, entierement cote client : on observe les changements d'etat recus.
// Le moteur n'est pas touche — si une animation echoue, le jeu continue normalement.
let ramassage=null;        // {cartes, gagnant, cle} pendant le ramassage
let ramassageTimer=null;
let cartesPosees=new Set();// ids deja animes a l'arrivee (une animation par carte, pas par rendu)
let dernierPli=null;       // longueur du pli au rendu precedent
let retourneRevelee=null;  // retourne deja revelee (l'animation ne joue qu'une fois)
let donneEnCours=false;      // une distribution est en train d'etre montree
let donneVisibles=null;      // nombre de cartes de MA main deja retournees pendant la donne
let donneCle=null;           // identifie la donne en cours (une animation par donne)
let echelleAdverse=1;        // reduction des mains adverses quand la hauteur manque
let scoreAffiche=null, scoreRaf=null; // points en cours de defilement dans le bandeau
const DUREE_RAMASSAGE=430;
let notice=null, noticeTimer=null; // petit mot passager dans le bandeau
let flipPending=false; // demande d'animer le rangement au prochain rendu
let freshEntered=false;// l'animation d'arrivee a deja ete jouee (evite qu'elle rejoue a chaque rendu)
const FRESH_PAUSE_MS = 2000;

// Le pli est passe de 4 cartes a 0 : il vient d'etre ramasse. On rejoue les 4 cartes
// (fournies par lastTrick) en les faisant glisser vers le gagnant.
// ---------- DISTRIBUTION VISIBLE ----------
// Detectee cote client : ma main passe a 5 cartes toutes neuves (aucune en commun avec
// la donne precedente). Purement visuel : le jeu n'attend pas la fin de l'animation.
function detectDonne(nv){
  const ids=(nv.hand||[]).map(c=>c.id);
  if(ids.length!==5) return;
  const communes = ids.filter(id=>handIds.indexOf(id)>=0).length;
  if(communes>0) return;                       // ce n'est pas une nouvelle donne
  const cle = ids.slice().sort().join('|');
  if(donneCle===cle) return;                   // deja montree
  donneCle=cle;
  // on laisse l'ecran se dessiner : le talon (a cote de la retourne) doit exister avant
  // qu'on lise sa position, sinon la distribution partirait d'un point arbitraire
  setTimeout(()=>lancerDonne(nv), 40);
}

const DONNE = {vol:368, entreCartes:54, avantRetourne:240, parCarte:72, entreJoueurs:112};

function lancerDonne(nv){
  const ancienne=document.getElementById('couche-donne');
  if(ancienne) ancienne.remove();
  const couche=document.createElement('div'); couche.id='couche-donne';
  document.body.appendChild(couche);

  const L=window.innerWidth, H=window.innerHeight;
  // Les cartes partent du VRAI talon, celui pose a cote de la carte retournee. On lit sa
  // position a l'ecran : ainsi la distribution sort exactement de la pile visible, au lieu
  // d'un tas fantome qui se superposait a la retourne.
  const vraiTalon=document.querySelector('.talon-back');
  let cx, cy, talon=null;
  if(vraiTalon){
    const r=vraiTalon.getBoundingClientRect();
    cx=r.left+r.width/2; cy=r.top+r.height/2;
  }else{
    cx=L/2; cy=H*0.47;
    talon=document.createElement('div'); talon.className='talon-centre';
    talon.style.left=cx+'px'; talon.style.top=cy+'px';
    couche.appendChild(talon);
  }

  const cible = (seat)=>{
    const d=screenSlot(seat);
    if(d==='bottom') return {x:L/2,      y:H*0.86};
    if(d==='top')    return {x:L/2,      y:H*0.14};
    if(d==='left')   return {x:L*0.08,   y:H*0.50};
    return {x:L*0.92, y:H*0.50};
  };

  const envoyer=(pos)=>{
    const v=document.createElement('div'); v.className='vol';
    v.style.left=cx+'px'; v.style.top=cy+'px';
    couche.appendChild(v);
    requestAnimationFrame(()=>{
      v.style.transform='translate(calc(-50% + '+(pos.x-cx)+'px), calc(-50% + '+(pos.y-cy)+'px)) '
                      + 'scale(.62) rotate('+(Math.random()*24-12)+'deg)';
    });
    setTimeout(()=>{ v.style.opacity='0'; }, DONNE.vol*0.72);
    setTimeout(()=>v.remove(), DONNE.vol+240);
  };

  // ordre de service : le donneur sert d'abord a sa droite (rotation du moteur : (p+3)%4)
  const donneur = (nv.dealer===null||nv.dealer===undefined) ? 0 : nv.dealer;
  const suivant = (p)=>(p+3)%4;
  const ordre=[]; let p=donneur;
  for(let i=0;i<4;i++){ p=suivant(p); ordre.push(p); }
  const premier = nv.dealFirst===2 ? 2 : 3;
  const paquets=[premier, 5-premier];

  donneEnCours=true; donneVisibles=0; render();
  let t=0;
  const plus=(ms)=>{ t+=ms; return t; };
  for(const taille of paquets){
    for(const siege of ordre){
      for(let k=0;k<taille;k++) setTimeout(()=>envoyer(cible(siege)), plus(DONNE.entreCartes));
      if(siege===ME){
        plus(DONNE.avantRetourne);
        for(let k=0;k<taille;k++) setTimeout(()=>{ donneVisibles++; render(); }, plus(DONNE.parCarte));
      }
      plus(DONNE.entreJoueurs);
    }
  }
  if(talon) setTimeout(()=>{ talon.style.opacity='0'; }, t);
  setTimeout(()=>{
    couche.remove(); donneEnCours=false; donneVisibles=null; render();
  }, t+320);
}

function detectRamassage(nv){
  const avant = dernierPli;
  const maintenant = (nv.trick||[]).length;
  if(avant===4 && maintenant===0 && nv.lastTrick && nv.lastTrick.length===4
     && nv.lastTrickWinner!==null && nv.lastTrickWinner!==undefined){
    const cle = 'pli'+nv.trickNum+'-'+nv.lastTrickWinner;
    if(!ramassage || ramassage.cle!==cle){
      ramassage = { cartes: nv.lastTrick.slice(), gagnant: nv.lastTrickWinner, cle };
      if(ramassageTimer) clearTimeout(ramassageTimer);
      ramassageTimer = setTimeout(()=>{ ramassage=null; ramassageTimer=null; render(); }, DUREE_RAMASSAGE+60);
    }
  }
  if(maintenant===0 && avant!==0) cartesPosees.clear(); // nouveau pli : on repart propre
  dernierPli = maintenant;
}

// Ecart de chaque emplacement par rapport au CENTRE du pli : sert a regrouper les cartes
// en tas (on applique l'oppose de cet ecart) avant de les envoyer vers le gagnant.
function ecartAuCentre(seat){
  const d = screenSlot(seat);
  if(d==='bottom') return {x:0,   y:62};
  if(d==='top')    return {x:0,   y:-62};
  if(d==='left')   return {x:-74, y:0};
  return {x:74, y:0};
}

// Vers ou glissent les cartes / d'ou elles arrivent, selon la position a l'ecran du siege
function decalageVers(seat){
  const d = screenSlot(seat);
  if(d==='bottom') return {dx:'0px',  dy:'130px'};
  if(d==='top')    return {dx:'0px',  dy:'-130px'};
  if(d==='left')   return {dx:'-130px',dy:'0px'};
  return {dx:'130px', dy:'0px'};
}

function detectFreshCards(nv){
  const ids=(nv.hand||[]).map(c=>c.id);
  const prev=handIds;
  if(prev.length && ids.length>prev.length){
    const added=ids.filter(id=>prev.indexOf(id)<0);
    if(added.length){
      freshIds=added;
      freshEntered=false;
      if(freshTimer) clearTimeout(freshTimer);
      freshTimer=setTimeout(()=>{
        freshIds=[]; freshTimer=null; flipPending=true; render();
      }, FRESH_PAUSE_MS);
    }
  }
  // main qui retrecit (carte jouee) ou nouvelle donne : on annule tout affichage en cours
  if(ids.length<prev.length && freshIds.length){
    freshIds=[]; flipPending=false;
    if(freshTimer){ clearTimeout(freshTimer); freshTimer=null; }
  }
  handIds=ids;
}

let myName=''; // conserve meme AVANT d'avoir un siege/jeton, pour pouvoir se reconnecter en attente
let disconnected=false;
let intentionalClose=false;

let lastPong=0, heartbeatTimer=null, watchdogTimer=null;
let connecting=false, onOpenQueue=[];
function startHeartbeat(){
  stopHeartbeat();
  lastPong = Date.now();
  heartbeatTimer = setInterval(()=>{ if(ws && ws.readyState===1) ws.send(JSON.stringify({type:'ping'})); }, 6000);
  watchdogTimer = setInterval(()=>{
    // aucun pong recu depuis trop longtemps : le tuyau est mort meme si readyState dit
    // encore "ouvert" (cas frequent sur mobile, wifi<->4G, mise en arriere-plan). On force
    // une vraie fermeture pour declencher la reconnexion, plutot que de laisser les clics
    // partir dans le vide en silence.
    if(Date.now()-lastPong > 16000){ try{ ws && ws.close(); }catch(e){} }
  }, 4000);
}
function stopHeartbeat(){
  if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer=null; }
  if(watchdogTimer){ clearInterval(watchdogTimer); watchdogTimer=null; }
}

function connect(then){
  // Une seule tentative de connexion a la fois. Sans ce garde-fou, plusieurs appels
  // simultanes (clic + reconnexion automatique + rejeu d'action) creaient chacun leur
  // WebSocket : les anciennes restaient orphelines et declenchaient a leur tour des
  // reconnexions, en cascade. Les actions en attente sont rejouees a l'ouverture.
  if(then) onOpenQueue.push(then);
  if(connecting) return;
  connecting=true;
  if(ws){ try{ ws.onclose=null; ws.onmessage=null; ws.onopen=null; ws.close(); }catch(e){} }
  const proto = location.protocol==='https:'?'wss:':'ws:';
  try{
    ws = new WebSocket(proto+'//'+location.host);
  }catch(e){
    // sans ce garde-fou, l'echec laisserait 'connecting' a vrai et TOUTE tentative
    // ulterieure de connexion serait ignoree en silence
    connecting=false; onOpenQueue.length=0;
    notice='Connexion au serveur impossible — réessaie dans un instant';
    render(); return;
  }
  ws.onerror = ()=>{ /* le navigateur declenche ensuite onclose, qui fait le necessaire */ };
  ws.onopen=()=>{
    connecting=false; disconnected=false; startHeartbeat(); render();
    const q=onOpenQueue.slice(); onOpenQueue.length=0;
    for(const f of q){ try{ f(); }catch(e){} }
  };
  ws.onmessage=(ev)=>{
    const m=JSON.parse(ev.data);
    if(m.type==='pong'){ lastPong=Date.now(); return; }
    if(m.type==='notice'){
      notice=m.text;
      if(noticeTimer) clearTimeout(noticeTimer);
      noticeTimer=setTimeout(()=>{ notice=null; noticeTimer=null; render(); }, 4500);
      render(); return;
    }
    if(m.type==='error'){
      // la partie n'existe plus (ex: fermee apres 2h) : on oublie la session pour ne pas
      // boucler indefiniment sur une reconnexion vouee a echouer
      sessionStorage.removeItem('belote');
      CODE=null; ME=-1; TOKEN=null; STARTED=false; V=null; PLAYERS=null;
      alert(m.error); render(); return;
    }
    if(m.type==='watch'){ WATCHING=true; CODE=m.code; PLAYERS=m.players; ME=-1;
      V=m.view; STARTED=!!m.view; render(); return; }
    if(m.type==='choose-seat'){ WATCHING=false; CODE=m.code; PLAYERS=m.players; ME=-1; STARTED=false;
      sessionStorage.setItem('belote', JSON.stringify({code:CODE, name:myName}));
      render(); return; }
    if(m.type==='joined'){ WATCHING=false; CODE=m.code; ME=m.seat; TOKEN=m.token; STARTED=m.started;
      sessionStorage.setItem('belote', JSON.stringify({code:CODE, token:TOKEN, name:myName}));
      render(); return; }
    if(m.type==='lobby'){ PLAYERS=m.players; STARTED=m.started; render(); return; }
    if(m.type==='view'){ if(m.watching) WATCHING=true; detectRamassage(m.view); detectDonne(m.view); detectFreshCards(m.view); V=m.view; PLAYERS=m.players; STARTED=true; render(); return; }
  };
  ws.onclose=()=>{
    connecting=false;
    stopHeartbeat();
    onOpenQueue.length=0;
    if(intentionalClose){ intentionalClose=false; return; } // depart volontaire
    const saved0=sessionStorage.getItem('belote');
    if(!saved0){
      // aucune partie en cours a rejoindre : inutile de promettre une reconnexion
      disconnected=false;
      notice='Connexion au serveur impossible — réessaie dans un instant';
      if(noticeTimer) clearTimeout(noticeTimer);
      noticeTimer=setTimeout(()=>{ notice=null; noticeTimer=null; render(); }, 6000);
      render(); return;
    }
    disconnected=true; render();
    setTimeout(()=>{
      const saved=sessionStorage.getItem('belote');
      if(!saved) return;
      const {code,token,name}=JSON.parse(saved);
      connect(()=>{
        if(token) send({type:'join', code, token});
        else send({type:'join', code, name: name||myName});
      });
    }, 1200);
  };
}
function send(o){
  if(ws && ws.readyState===1){ ws.send(JSON.stringify(o)); return; }
  // la connexion est tombee au mauvais moment (mise en veille mobile, reseau) : on se
  // reconnecte ET on REJOUE l'action initiale (ex: le 'sit' du clic) sur la nouvelle
  // connexion, sinon la reconnexion reussit mais le clic de la personne reste sans effet
  const saved=sessionStorage.getItem('belote');
  if(!saved) return;
  const {code,token,name}=JSON.parse(saved);
  connect(()=>{
    ws.send(JSON.stringify(token ? {type:'join', code, token} : {type:'join', code, name: name||myName}));
    ws.send(JSON.stringify(o));
  });
}

// Place les cartes de la main en eventail, sur UNE seule ligne.
// L'ecartement est FIXE (calcule pour une main pleine de 8 cartes) : quand il ne reste
// que 3 cartes, elles restent cote a cote au lieu de s'etaler sur toute la largeur.
const EVENTAIL = {angle:5, arc:11, ecart:-3, large:78, haut:112, mainPleine:8};
function disposerEnEventail(conteneur){
  const cartes=[...conteneur.children];
  const n=cartes.length;
  if(!n) return;
  // Sur un ecran court (petit telephone, barre du navigateur affichee), des cartes trop
  // grandes ecrasent tout le reste : on revient alors a la taille precedente.
  const petit = window.innerHeight < 660;
  const E = petit ? Object.assign({}, EVENTAIL, {large:66, haut:96}) : EVENTAIL;
  for(const el of cartes){ el.style.width=E.large+'px'; el.style.height=E.haut+'px'; }
  conteneur.style.height=E.haut+'px';

  // budget de largeur : on retranche le debordement du a l'inclinaison (les cartes des
  // extremites pivotent vers l'exterieur autour d'un point situe sous la main)
  const milieuPlein=(E.mainPleine-1)/2;
  const angleMax=Math.abs(milieuPlein*E.angle)*Math.PI/180;
  const rayon=1.35*E.haut - E.haut/2;
  const debord=rayon*Math.sin(angleMax) + (E.haut*Math.sin(angleMax)+E.large*Math.cos(angleMax)-E.large)/2;
  const dispo=Math.min(window.innerWidth-16, 520) - 2*Math.max(0,debord);

  // ecartement calcule UNE fois pour la main pleine, puis conserve
  const pas=Math.min(E.large+E.ecart, (dispo-E.large)/(E.mainPleine-1));
  const largeurTotale=(n-1)*pas+E.large;
  const depart=-largeurTotale/2+E.large/2;
  const milieu=(n-1)/2;

  cartes.forEach((el,i)=>{
    const k=i-milieu;
    const monte = milieu>0 ? E.arc*(1-Math.pow(k/milieu,2)) : E.arc;
    el.style.left='calc(50% + '+(depart+i*pas)+'px)';
    el.style.marginLeft=(-E.large/2)+'px';
    el.style.bottom=monte+'px';
    el.style.transform='rotate('+(k*E.angle)+'deg)';
    el.style.zIndex=String(10+i);
  });
}

// Meme principe que notre main, adapte aux trois autres joueurs : ecartement FIXE
// (calcule pour 8 cartes) et petit arc. En haut l'eventail est horizontal ; sur les
// cotes il est vertical, la courbure tournee vers l'exterieur de la table.
const EVENTAIL_ADV = {angle:6, arc:10, pas:14, large:50, haut:72, mainPleine:8};
// Repartit les mains adverses dans l'espace REELLEMENT libre entre le bandeau et notre
// main. Sur telephone (fenetre courte, barre du navigateur), cet espace fond : sans ce
// calcul, les eventails des cotes venaient percuter celui d'en face.
function placerPseudo(root, lb, wrap, pos){
  const rects=[...wrap.querySelectorAll('.mini-card')].map(e=>e.getBoundingClientRect());
  if(!rects.length) return;
  const rr=root.getBoundingClientRect();
  const hautFan=Math.min(...rects.map(r=>r.top));
  const basFan=Math.max(...rects.map(r=>r.bottom));
  const gaucheFan=Math.min(...rects.map(r=>r.left));
  const droiteFan=Math.max(...rects.map(r=>r.right));
  const lr=lb.getBoundingClientRect();
  let x;
  if(pos==='left')       x=gaucheFan-rr.left;
  else if(pos==='right') x=droiteFan-rr.left-lr.width;
  else                   x=(gaucheFan+droiteFan)/2-rr.left-lr.width/2;
  // les mains debordent volontairement un peu de l'ecran : le pseudo, lui, reste lisible
  x=Math.max(4, Math.min(x, rr.width-lr.width-4));
  lb.style.left=Math.round(x)+'px';
  // Le joueur d'en face : pseudo au-dessus de sa main, SAUF s'il viendrait mordre sur le
  // bandeau des scores — dans ce cas il passe dessous. Les cotes : toujours en dessous,
  // le haut des bords etant occupe par les boutons ronds.
  const hud=root.querySelector('.hud');
  const basHud=hud?hud.getBoundingClientRect().bottom:rr.top;
  let y;
  if(pos==='top'){
    const dessus=hautFan-lr.height-6;
    y=(dessus>=basHud+4 ? dessus : basFan+6)-rr.top;
  }else{
    y=basFan+6-rr.top;
  }
  lb.style.top=Math.round(y)+'px';
}

function ajusterMainsAdverses(root){
  const hud=root.querySelector('.hud');
  const main=root.querySelector('.bottom-hand');
  const cotes=['top','left','right'].map(p=>({p, el:root.querySelector('.'+p+'-hand')})).filter(x=>x.el);
  if(!cotes.length) return;
  const rr=root.getBoundingClientRect();
  const debut=(hud?hud.getBoundingClientRect().bottom:rr.top)-rr.top+10;
  const fin  =(main?main.getBoundingClientRect().top:rr.bottom)-rr.top-10;
  const bande=Math.max(120, fin-debut);

  // On MESURE l'encombrement reel de chaque eventail (rotation et arc compris) plutot que
  // de l'estimer : c'est ce qui manquait, l'estimation etait trop optimiste sur petit ecran.
  const mesurer=(el)=>{
    const r=[...el.querySelectorAll('.mini-card')].map(x=>x.getBoundingClientRect());
    if(!r.length) return null;
    const y=Math.min(...r.map(v=>v.top)), Y=Math.max(...r.map(v=>v.bottom));
    const ancre=el.getBoundingClientRect().top;      // point de pivot du conteneur
    return {hauteur:Y-y, decalage:(y+Y)/2-ancre};    // hauteur et position du centre / pivot
  };
  const m={}; for(const c of cotes) m[c.p]=mesurer(c.el);

  const hHaut=m.top?m.top.hauteur:0;
  const hCote=Math.max(m.left?m.left.hauteur:0, m.right?m.right.hauteur:0);
  const besoin=hHaut + hCote + 20;
  echelleAdverse=Math.min(1, bande/besoin);
  const s=echelleAdverse;

  for(const c of cotes){
    const quart = c.p==='top' ? 180 : (c.p==='left' ? 90 : -90);
    c.el.style.transform='rotate('+quart+'deg) scale('+s+')';
  }
  // on place chaque main d'apres le centre voulu, en tenant compte du decalage mesure
  const poser=(p, centreVoulu)=>{
    const c=cotes.find(x=>x.p===p); if(!c || !m[p]) return;
    c.el.style.top=Math.round(centreVoulu - s*m[p].decalage)+'px';
  };
  poser('top', debut + s*hHaut/2);
  // les eventails des cotes sont CENTRES dans l'espace qui reste : sinon, cales sur le haut,
  // ils semblaient remonter au fur et a mesure que les cartes etaient jouees
  const debutCotes=debut + s*hHaut + 10;
  const centreCotes=Math.max(debutCotes + s*hCote/2, (debutCotes + fin)/2);
  poser('left', centreCotes);
  poser('right', centreCotes);

  // les mains ont bouge : les pseudos doivent suivre
  for(const lb of root.querySelectorAll('.bot-label')){
    const pos=lb.dataset.pos;
    const wrap=root.querySelector('.'+pos+'-hand');
    if(wrap) placerPseudo(root, lb, wrap, pos);
  }
}

function disposerEventailAdverse(conteneur, pos, n){
  if(!n) return;
  const E=EVENTAIL_ADV;
  const milieu=(n-1)/2;
  // On dispose la main EXACTEMENT comme la notre (eventail ouvert vers le haut, centre
  // sur le point d'origine), puis on fait pivoter l'ensemble selon la place du joueur.
  // Ainsi chaque bot semble tenir ses cartes face a lui, comme un vrai joueur.
  [...conteneur.children].forEach((el,i)=>{
    const k=i-milieu;
    const monte = milieu>0 ? E.arc*(1-Math.pow(k/milieu,2)) : E.arc;
    el.style.left=(k*E.pas - E.large/2)+'px';
    el.style.top=(-monte - E.haut/2)+'px';
    el.style.transform='rotate('+(k*E.angle)+'deg)';
    el.style.transformOrigin='50% 135%';   // pivot sous la main, comme la notre
    el.style.zIndex=String(10+i);
  });
  // un quart de tour pour les joueurs des cotes, un demi-tour pour celui d'en face
  const quart = pos==='top' ? 180 : (pos==='left' ? 90 : -90);
  conteneur.style.transform='rotate('+quart+'deg) scale('+echelleAdverse+')';
  conteneur.style.transformOrigin='50% 50%';
}

function cardEl(c, cls, onClick){
  const d=document.createElement('div');
  d.className='card'+(cls?' '+cls:'');
  d.style.color = SUIT_COLORS[c.suit];
  d.innerHTML='<div class="r1">'+c.rank+c.suit+'</div><div class="suit-big">'+c.suit+'</div><div class="r2">'+c.rank+c.suit+'</div>';
  if(onClick) d.onclick=onClick;
  return d;
}

// ---------- parties en cours (ecran d'accueil) ----------
// On interroge une simple adresse web toutes les 5 s et on ne remplace QUE la liste :
// un redessin complet effacerait le prenom en cours de frappe.
let roomsTimer=null;
async function refreshRooms(){
  const box=document.getElementById('rooms-list');
  if(!box) return;
  try{
    const r=await fetch('/api/rooms', {cache:'no-store'});
    const list=await r.json();
    fillRooms(box, list);
  }catch(e){
    box.innerHTML='<h3>Parties en cours</h3><div class="empty">Liste indisponible</div>';
  }
  if(roomsTimer) clearTimeout(roomsTimer);
  roomsTimer=setTimeout(()=>{ if(document.getElementById('rooms-list')) refreshRooms(); }, 5000);
}

function fillRooms(box, list){
  box.innerHTML='<h3>Parties en cours</h3>';
  if(!list.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent='Aucune partie pour le moment — crée la première !';
    box.appendChild(e); return;
  }
  for(const p of list){
    const row=document.createElement('div'); row.className='room-row';
    const who=document.createElement('div'); who.className='who';
    const absents=(p.absents||[]);
    const deserte = !p.joueurs.length && absents.length; // table tenue par les bots
    let noms;
    if(p.joueurs.length) noms = p.joueurs.map(esc).join(', ');
    else if(absents.length) noms = 'les bots jouent pour ' + absents.map(esc).join(', ');
    else noms = 'personne encore';
    who.innerHTML='<span>'+esc(p.code)+'</span><small>'+noms
      + (p.libres ? ' · '+p.libres+' place'+(p.libres>1?'s':'')+' libre'+(p.libres>1?'s':'') : ' · table complète')
      + '</small>';
    const tag=document.createElement('span');
    tag.className='tag '+(deserte ? 'tag-back' : p.started?'tag-live':'tag-wait');
    tag.textContent = deserte ? 'reviens !' : (p.started ? 'en cours' : 'en attente');
    row.appendChild(who); row.appendChild(tag);
    row.onclick=()=>openRoomChoice(p);
    box.appendChild(row);
  }
}

// Dialogue : rejoindre pour jouer, ou simplement regarder.
function openRoomChoice(p){
  if(!myName || !myName.trim()){ alert('Entre ton prénom avant de rejoindre une partie.'); return; }
  const root=document.getElementById('root');
  const o=overlay(root, ()=>render());
  const libre = p.libres>0;
  o.panel.innerHTML='<h2>Partie '+esc(p.code)+'</h2>'
    +'<p>'+(p.started ? 'La partie a déjà commencé.' : 'La partie n\'a pas encore commencé.')
    +'<br>'+(libre ? p.libres+' place'+(p.libres>1?'s':'')+' libre'+(p.libres>1?'s':'')+' à table.'
                   : 'Toutes les places sont prises.')+'</p>';

  if(libre){
    const bJoin=document.createElement('button'); bJoin.className='gold-btn';
    bJoin.textContent='PRENDRE UNE PLACE';
    bJoin.onclick=()=>connect(()=>send({type:'join', code:p.code, name:myName}));
    o.panel.appendChild(bJoin);
  }
  if(p.started){
    const bWatch=document.createElement('button'); bWatch.className='gold-btn small';
    bWatch.textContent='REGARDER LA PARTIE';
    bWatch.onclick=()=>connect(()=>send({type:'join', code:p.code, name:myName, mode:'watch'}));
    o.panel.appendChild(bWatch);
  }
  const bCancel=document.createElement('button'); bCancel.className='gold-btn small';
  bCancel.textContent='ANNULER'; bCancel.onclick=()=>render();
  o.panel.appendChild(bCancel);
}

function render(){
  const root=document.getElementById('root');
  // FLIP (1/2) : on releve la position de chaque carte AVANT de tout redessiner, indexee
  // par id. Apres reconstruction on animera l'ecart, ce qui donne l'impression que les
  // memes cartes glissent a leur nouvelle place.
  const prevRects=new Map();
  if(flipPending){
    root.querySelectorAll('.card[data-cid]').forEach(el=>prevRects.set(el.dataset.cid, el.getBoundingClientRect()));
  }
  root.innerHTML='';

  // boutons ronds ambiance + plein ecran : disponibles partout SAUF sur l'ecran de choix
  // des sieges (contenu plus dense que le solo, un bouton en position fixe pouvait
  // recouvrir la chaise du haut et intercepter le clic destine a la chaise en dessous)
  if(STARTED || ME<0){
    const tb=iconBtn('ib-l1','\u25D0','Changer l\'ambiance', cycleTheme);
    root.appendChild(tb);
    const fb=document.createElement('div'); fb.className='icon-btn ib-l2';
    fb.innerHTML = isFullscreen() ? ICON_CONTRACT : ICON_EXPAND;
    fb.title = isFullscreen() ? 'Quitter le plein écran' : 'Plein écran';
    fb.onclick = toggleFullscreen;
    root.appendChild(fb);
  }
  if(clientToast){
    const tt=document.createElement('div'); tt.className='theme-toast'; tt.textContent=clientToast;
    root.appendChild(tt);
  }
  // hors partie (accueil, choix de place), le bandeau de jeu n'existe pas : on affiche
  // quand meme les annonces, sinon un message d'erreur resterait invisible
  if(notice && !V){
    const nt=document.createElement('div'); nt.className='theme-toast';
    nt.style.background='rgba(90,50,20,.92)'; nt.style.color='#f4d99a';
    nt.textContent=notice;
    root.appendChild(nt);
  }
  if(disconnected){
    const dc=document.createElement('div'); dc.className='theme-toast';
    dc.style.background='rgba(160,30,30,.88)';
    dc.textContent='Connexion perdue — reconnexion en cours…';
    root.appendChild(dc);
  }

  // ---------- accueil ----------
  if(!CODE){
    const home=document.createElement('div'); home.className='home-screen';
    home.innerHTML='<p>Belote du Gang — les sièges vides sont tenus par les bots.</p>';
    const name=document.createElement('input'); name.placeholder='Ton prénom'; name.maxLength=14;
    name.style.cssText='padding:10px;border-radius:10px;border:2px solid var(--gold-border);font-size:15px;text-align:center;';
    const bC=document.createElement('button'); bC.className='gold-btn'; bC.textContent='CRÉER UNE PARTIE';
    // garde anti double-clic : sans cela, deux clics rapides creaient DEUX parties
    bC.onclick=()=>{ if(bC.disabled) return; bC.disabled=true; bJ.disabled=true;
      myName=name.value; connect(()=>send({type:'create', name:myName})); };
    const code=document.createElement('input'); code.placeholder='CODE'; code.maxLength=4;
    code.style.cssText='padding:10px;border-radius:10px;border:2px solid var(--gold-border);font-size:15px;text-align:center;text-transform:uppercase;width:90px;';
    const bJ=document.createElement('button'); bJ.className='gold-btn'; bJ.textContent='REJOINDRE';
    bJ.onclick=()=>{ if(bJ.disabled) return;
      const wanted=code.value.trim().toUpperCase();
      if(wanted.length!==4){ alert('Le code de la partie fait 4 lettres.'); return; }
      bJ.disabled=true; bC.disabled=true;
      myName=name.value; connect(()=>send({type:'join', code:wanted, name:myName})); };
    home.appendChild(name); home.appendChild(bC);
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:10px;align-items:center;';
    row.appendChild(code); row.appendChild(bJ); home.appendChild(row);

    // on retient le prenom au fil de la frappe : la liste se rafraichit toute seule et
    // ne doit pas faire perdre ce qui est deja tape
    name.value = myName || '';
    name.addEventListener('input', ()=>{ myName = name.value; });

    const rooms=document.createElement('div'); rooms.className='rooms'; rooms.id='rooms-list';
    rooms.innerHTML='<h3>Parties en cours</h3><div class="empty">Recherche…</div>';
    home.appendChild(rooms);
    root.appendChild(home);
    refreshRooms();
    return;
  }

  // ---------- lobby : table avec sieges cliquables ----------
  if(!STARTED){
    const l=document.createElement('div'); l.className='home-screen';
    const intro = ME<0
      ? 'Choisis ta place : clique la chaise que tu veux.'
      : 'Partage ce code à tes amis. Clique une autre chaise libre pour changer de place.';
    l.innerHTML='<h2 style="color:#f4d99a">Code de la partie : <b>'+CODE+'</b></h2>'
      +'<p>'+intro+'<br>Les sièges 0-2 et 1-3 sont partenaires ; les chaises vides seront des bots.</p>';

    // Disposition en croix via une grille 3x3 (positions fixes, pas d'absolu -> aucun
    // chevauchement possible). Chaque siege est place a sa vraie position autour de la table :
    //   haut = siege 2, bas = siege 0 (equipe verte) ; gauche = 3, droite = 1 (equipe rouge)
    const grid=document.createElement('div');
    grid.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;'
      +'gap:8px;width:100%;max-width:340px;margin:10px auto;align-items:center;justify-items:center;';
    const cellOf={2:'1 / 2 / 2 / 3', 3:'2 / 1 / 3 / 2', 1:'2 / 3 / 3 / 4', 0:'3 / 2 / 4 / 3'}; // row/col start-end
    const teamCol={0:'#bfe6c9',1:'#f3c1c1'};

    function seatChip(i){
      const p=PLAYERS && PLAYERS.find(x=>x.seat===i);
      const isHuman = p && p.human;
      const isFree  = !isHuman;                       // toute chaise non-humaine est libre (bot)
      // c'est la chaise ou J'ETAIS assis : liseré doré, comme les cartes qu'on vient de recevoir
      const maPlace = !!(p && p.ancien && myName && p.ancien===myName && i!==ME);
      const chip=document.createElement('div');
      if(maPlace) chip.className='seat-mine';
      chip.style.cssText='width:100%;min-height:62px;display:flex;flex-direction:column;'
        +'align-items:center;justify-content:center;text-align:center;padding:8px 6px;border-radius:12px;'
        +'font-size:12.5px;font-weight:700;line-height:1.25;'
        +'border:2px solid '+(i===ME||maPlace?'#f4d99a':'rgba(255,255,255,.3)')+';'
        +'background:rgba(0,0,0,'+(isFree?'.35':'.55')+');color:'+teamCol[i%2]+';'
        +((isFree||maPlace) && i!==ME ? 'cursor:pointer;' : '');
      chip.style.gridArea=cellOf[i];

      let label, sub;
      if(isHuman){ label='👤 '+esc(p.name); sub = i===ME ? '(toi)' : 'prêt'; }
      else if(STARTED){ label='🤖 '+esc(p.name); sub='chaise libre — clique pour t\'asseoir'; }
      else { label='🤖 chaise libre'; sub='clique pour t\'asseoir'; }
      if(maPlace) sub='⭐ ta place — clique pour reprendre';
      const teamName = (i%2)===0 ? 'verte' : 'rouge';
      chip.innerHTML='<div>'+label+'</div><small style="opacity:.8;font-weight:400">'+sub+'</small>'
        +'<small style="opacity:.55;font-size:10px">équipe '+teamName+'</small>';
      if((isFree||maPlace) && i!==ME) chip.onclick=()=>send({type:'sit', seat:i, token:TOKEN});
      return chip;
    }
    // centre de la croix : petit rappel des equipes
    const center=document.createElement('div');
    center.style.cssText='grid-area:2 / 2 / 3 / 3;text-align:center;color:#8fae97;font-size:10px;line-height:1.3;';
    center.innerHTML='🟢 verte<br>haut+bas<br><br>🔴 rouge<br>gauche+droite';

    [0,1,2,3].forEach(i=>grid.appendChild(seatChip(i)));
    grid.appendChild(center);
    l.appendChild(grid);

    // compteur de joueurs prêts, pour être sûr que tout le monde est bien la avant de lancer
    const humansReady = (PLAYERS||[]).filter(p=>p.human).length;
    const status=document.createElement('p');
    status.style.cssText='color:#dfeee2;font-size:12.5px;margin:6px 0;';
    status.innerHTML='👤 '+humansReady+' joueur'+(humansReady>1?'s':'')+' en place'
      + (humansReady<4 ? ' · les '+(4-humansReady)+' place'+(4-humansReady>1?'s':'')+' restante'+(4-humansReady>1?'s':'')+' seront des bots 🤖' : '');
    l.appendChild(status);

    if(ME>=0){
      const go=document.createElement('button'); go.className='gold-btn'; go.textContent='LANCER LA PARTIE';
      go.onclick=()=>send({type:'start'});
      l.appendChild(go);
    }
    root.appendChild(l);
    return;
  }
  if(!V) return;

  // ---------- barre de score ----------
  const myTeam = (ME<0 ? 0 : ME)%2; // TEAM_OF = [0,1,0,1] (spectateur : point de vue du siege 0)
  const hud=document.createElement('div'); hud.className='hud';
  const row=document.createElement('div'); row.className='hud-scores';
  const nous=V.scores[myTeam], eux=V.scores[1-myTeam];
  // Les points defilent jusqu'a leur valeur au lieu de sauter : on n'anime QUE ces deux
  // nombres (pas de redessin general, qui relancerait les autres animations).
  if(!scoreAffiche) scoreAffiche=[nous,eux];
  const depart=[scoreAffiche[0], scoreAffiche[1]];
  row.innerHTML='<span class="team nous">Nous <small id="sc-nous">'+Math.min(depart[0],1000)+'/1000</small></span>'
    +'<span class="team eux">Eux <small id="sc-eux">'+Math.min(depart[1],1000)+'/1000</small></span>';
  hud.appendChild(row);
  if(depart[0]!==nous || depart[1]!==eux){
    if(scoreRaf) cancelAnimationFrame(scoreRaf);
    const t0=performance.now(), duree=560;
    const pas=(t)=>{
      const k=Math.min(1,(t-t0)/duree);
      const a=Math.round(depart[0]+(nous-depart[0])*k), b=Math.round(depart[1]+(eux-depart[1])*k);
      const en=document.getElementById('sc-nous'), ee=document.getElementById('sc-eux');
      if(en) en.textContent=Math.min(a,1000)+'/1000';
      if(ee) ee.textContent=Math.min(b,1000)+'/1000';
      scoreAffiche=[a,b];
      if(k<1) scoreRaf=requestAnimationFrame(pas); else { scoreAffiche=[nous,eux]; scoreRaf=null; }
    };
    scoreRaf=requestAnimationFrame(pas);
  }

  // annonce passagere (arrivee d'un joueur ou d'un spectateur), au meme endroit que le reste
  if(notice){
    const nt=document.createElement('div'); nt.className='hud-round hud-notice';
    nt.textContent=notice;
    hud.appendChild(nt);
  }

  // code de la partie + TON pseudo, toujours visibles (meme en cours de jeu) : le code pour
  // qu'un ami rejoigne, le pseudo pour te reconnecter facilement au meme siege si tu bugues
  if(CODE){
    const cw=document.createElement('div'); cw.className='hud-round';
    cw.style.color='#f4d99a';
    const who = myName ? ' · toi : <b>'+esc(myName)+'</b>' : '';
    cw.innerHTML='Code : <b style="letter-spacing:2px;font-size:13px">'+CODE+'</b>'+who;
    hud.appendChild(cw);
  }
  if(V.screen==='play' && V.taker!==null){
    const r2=document.createElement('div'); r2.className='hud-round';
    const tn = nameOf(V.taker);
    const tTeam = (V.taker%2)===myTeam ? 'Nous':'Eux';
    const obj = V.beloteBonus && V.beloteBonus.team!==null ? 91 : 82;
    r2.textContent='Atout '+V.trumpSuit+' — pris par '+tn+' ('+tTeam+') — Manche : Nous '
      +V.roundPts[myTeam]+' / Eux '+V.roundPts[1-myTeam]+' (objectif '+obj+')';
    hud.appendChild(r2);
  }
  if(V.pendingLitige){
    const lit=document.createElement('div'); lit.className='hud-round';
    lit.style.cssText='color:#ffd98a;font-weight:800;';
    lit.textContent='⚖ '+V.pendingLitige+' pts en litige — pour le vainqueur de cette donne';
    hud.appendChild(lit);
  }
  root.appendChild(hud);

  // ---------- mains adverses (dos) + noms ----------
  const slots={top:'top-hand', left:'left-hand', right:'right-hand'};
  for(let s=0;s<4;s++){
    if(s===ME) continue;
    const pos=screenSlot(s);
    const wrap=document.createElement('div'); wrap.className=slots[pos];
    const n=V.counts[s]||0;
    for(let k=0;k<n;k++){ const m=document.createElement('div'); m.className='mini-card'; wrap.appendChild(m); }
    disposerEventailAdverse(wrap, pos, n);
    root.appendChild(wrap);
    const lb=document.createElement('div'); lb.className='bot-label label-'+pos;
    const pinfo = PLAYERS && PLAYERS.find(x=>x.seat===s);
    lb.textContent = ((pinfo && pinfo.human) ? '👤 ' : '🤖 ') + nameOf(s);
    // a qui le tour ? en jeu : leader + cartes deja posees ; aux encheres : biddingTurn.
    // La rotation du moteur va de p vers (p+3)%4.
    let doitAgir = -1;
    if(V.screen==='play' && V.leader!==null && V.leader!==undefined){
      doitAgir = ((V.leader + 3*V.trick.length) % 4 + 4) % 4;
    } else if(V.screen==='bidding'){
      doitAgir = V.biddingTurn;
    }
    if(s===doitAgir && !ramassage) lb.classList.add('a-lui');

    // Le pseudo est place a partir des bords REELS de l'eventail (mesures apres rotation),
    // et hors du conteneur : sinon il pivoterait avec les cartes. Il sera repositionne une
    // seconde fois une fois les mains reparties dans l'espace disponible.
    lb.style.position='absolute'; lb.style.zIndex='12';
    lb.dataset.pos=pos;
    root.appendChild(lb);
    placerPseudo(root, lb, wrap, pos);
  }

  // pastilles d'enchere + tour
  if(V.screen==='bidding' && V.bidDecisions){
    const pos={bottom:'bm-bottom',right:'bm-right',top:'bm-top',left:'bm-left'};
    for(let i=0;i<4;i++){
      const d=V.bidDecisions[i];
      let txt=null, extra='';
      if(d==='prend'){ txt='PREND'; extra=' takes'; }
      else if(d) txt=d;
      else if(V.biddingTurn===i){ txt='…'; extra=' turn'; }
      if(!txt) continue;
      const el=document.createElement('div'); el.className='bid-mark '+pos[screenSlot(i)]+extra;
      el.textContent=txt; root.appendChild(el);
    }
  }

  // filigrane + badge du preneur
  if((V.screen==='play'||V.screen==='roundEnd') && V.taker!==null && V.trumpSuit){
    const pos=screenSlot(V.taker);
    const wm=document.createElement('div'); wm.className='trump-watermark wm-'+pos;
    wm.style.color=(V.trumpSuit==='\u2665'||V.trumpSuit==='\u2666')?'#c1272d':'#111';
    wm.textContent=V.trumpSuit; root.appendChild(wm);
    // plus de jeton par-dessus les cartes : le filigrane, agrandi et plus contraste,
    // indique l'atout a lui seul. Sa position rappelle qui a pris.
  }

  // badge donneur
  const dPos=['dealer-bottom','dealer-right','dealer-top','dealer-left'];
  const db=document.createElement('div'); db.className='dealer-badge '+dPos[['bottom','right','top','left'].indexOf(screenSlot(V.dealer))];
  db.textContent='D'; root.appendChild(db);

  // bulle(s)
  if(V.bubbles){
    for(let i=0;i<4;i++){
      if(!V.bubbles[i]) continue;
      const b=document.createElement('div'); b.className='bubble bub-'+screenSlot(i);
      b.textContent=V.bubbles[i]; root.appendChild(b);
    }
  }
  if(V.banner){
    const b=document.createElement('div'); b.className='banner'; b.textContent=V.banner;
    if(/belote/i.test(V.banner)) b.classList.add('belote');
    root.appendChild(b);
  }

  // ---------- pli central ----------
  if(V.screen==='play'){
    const tw=document.createElement('div'); tw.className='trick-area';

    // Ramassage : on rejoue les 4 cartes du pli precedent, glissant vers le gagnant.
    if(ramassage){
      const vers = decalageVers(ramassage.gagnant);
      ramassage.cartes.forEach((pl, i)=>{
        const slot=document.createElement('div'); slot.className='trick-slot slot-'+screenSlot(pl.player);
        const el=cardEl(pl.card);
        const centre = ecartAuCentre(pl.player);
        el.classList.add('ramassee');
        el.style.setProperty('--cx', (-centre.x)+'px');   // regroupement vers le milieu
        el.style.setProperty('--cy', (-centre.y)+'px');
        el.style.setProperty('--wx', vers.dx);            // puis depart vers le gagnant
        el.style.setProperty('--wy', vers.dy);
        el.style.setProperty('--rot', (i*7-10)+'deg');    // leger desordre : un vrai tas n'est pas aligne
        el.style.setProperty('--duree', DUREE_RAMASSAGE+'ms');
        el.style.zIndex = String(10+i);
        slot.appendChild(el);
        tw.appendChild(slot);
      });
    }

    for(const pl of V.trick){
      const slot=document.createElement('div'); slot.className='trick-slot slot-'+screenSlot(pl.player);
      const el=cardEl(pl.card);
      // la carte glisse depuis le siege de celui qui vient de la poser — une seule fois
      if(!cartesPosees.has(pl.card.id)){
        cartesPosees.add(pl.card.id);
        const depuis = decalageVers(pl.player);
        el.style.setProperty('--dx', depuis.dx);
        el.style.setProperty('--dy', depuis.dy);
        el.classList.add('posee');
      }
      slot.appendChild(el);
      tw.appendChild(slot);
    }
    root.appendChild(tw);
  }
  // hors encheres, on oublie la retourne : ainsi l'animation se rejoue a chaque nouvelle
  // manche (les identifiants de cartes se repetent d'une donne a l'autre, ils ne peuvent
  // pas servir de repere fiable)
  if(V.screen!=='bidding') retourneRevelee=null;
  if(V.screen==='bidding' && V.turnedCard){
    const c=document.createElement('div'); c.className='center-area';
    const back=document.createElement('div'); back.className='talon-back';
    const cr=cardEl(V.turnedCard, 'turned-lg');
    if(!retourneRevelee){ retourneRevelee=true; cr.classList.add('revele'); }
    c.appendChild(back); c.appendChild(cr);
    root.appendChild(c);
  }

  // ---------- ma main ----------
  const hand=document.createElement('div'); hand.className='bottom-hand';
  // L'atout suit son propre ordre de force (V,9,A,10,R,D,8,7), different des couleurs
  // normales (7,8,9,V,D,R,10,A) : une main mal triee est deroutante, on trie donc chaque
  // carte selon le bareme qui la concerne.
  const PLAIN_RANKS=['7','8','9','V','D','R','10','A'], TRUMP_RANKS=['7','8','D','R','10','A','9','V'];
  const rankIdx = c => (c.suit===V.trumpSuit ? TRUMP_RANKS : PLAIN_RANKS).indexOf(c.rank);

  // On ALTERNE les couleurs a l'ecran : jamais coeur a cote de carreau, ni pique a cote de
  // trefle. Deux enseignes de teinte proche cote a cote se confondent au premier coup d'oeil.
  // L'ordre est calcule d'apres les couleurs REELLEMENT en main (une couleur absente ne doit
  // pas casser l'alternance des autres).
  const ordreCouleurs = (function(){
    const presentes = new Set(V.hand.map(c=>c.suit));
    const rouges = ['\u2665','\u2666'].filter(s=>presentes.has(s)); // coeur, carreau
    const noires = ['\u2660','\u2663'].filter(s=>presentes.has(s)); // pique, trefle
    const [longue, courte] = rouges.length>=noires.length ? [rouges,noires] : [noires,rouges];
    const ordre=[];
    for(let i=0;i<longue.length;i++){ ordre.push(longue[i]); if(courte[i]) ordre.push(courte[i]); }
    return ordre;
  })();
  const suitIdx = c => ordreCouleurs.indexOf(c.suit);
  const sorted=V.hand.slice().sort((a,b)=>suitIdx(a)-suitIdx(b) || rankIdx(a)-rankIdx(b));
  const freshSet = new Set(freshIds);
  // pendant la distribution, la main se remplit au rythme des cartes recues
  const limite = donneEnCours ? (donneVisibles||0) : sorted.length;
  let posees=0;
  for(const c of sorted){
    if(freshSet.has(c.id)) continue; // encore sur la rangee du dessus
    if(posees++ >= limite) continue; // pas encore arrivee
    const legal=!V.yourTurnToPlay || (V.legal && V.legal.includes(c.id));
    const el=cardEl(c, legal?'':'disabled', ()=>{ if(V.yourTurnToPlay) send({type:'play', id:c.id}); });
    el.dataset.cid=c.id;
    hand.appendChild(el);
  }
  disposerEnEventail(hand);
  root.appendChild(hand);
  ajusterMainsAdverses(root);   // repartit les mains adverses dans l'espace reellement libre

  // cartes qui viennent d'arriver : elles patientent au-dessus de la main, en evidence
  if(freshIds.length){
    const nr=document.createElement('div'); nr.className='new-row';
    for(const c of sorted){
      if(!freshSet.has(c.id)) continue;
      // 'arriving' UNIQUEMENT au premier affichage : le client redessine l'ecran a chaque
      // message du serveur, et rejouer l'animation a chaque fois faisait clignoter les cartes
      const el=cardEl(c, freshEntered ? 'fresh' : 'fresh arriving');
      el.dataset.cid=c.id;
      nr.appendChild(el);
    }
    root.appendChild(nr);
    freshEntered=true;
  }

  // ---------- barres d'action ----------
  if(V.yourTurnToDeal){
    bar(root, "C'est toi qui donnes — 2 ou 3 cartes en premier ?", [
      ['3 EN PREMIER', ()=>send({type:'deal', first:3})],
      ['2 EN PREMIER', ()=>send({type:'deal', first:2})]
    ]);
  }
  if(V.yourTurnToBid){
    if(V.biddingRound===1){
      bar(root, '1er tour — tu prends, ou tu dis 1 ?', [
        ['PRENDRE', ()=>send({type:'take'})],
        ['1 (PASSE)', ()=>send({type:'pass'})]
      ]);
    }else{
      const b=document.createElement('div'); b.className='bid-bar';
      const t=document.createElement('div'); t.className='bid-text';
      t.textContent='2e tour — choisis une couleur, ou dis 2';
      b.appendChild(t);
      for(const s of ['\u2665','\u2666','\u2663','\u2660']){
        if(s===V.turnedCard.suit) continue;
        const sb=document.createElement('button'); sb.className='suit-btn'; sb.textContent=s;
        sb.style.color=SUIT_COLORS[s];
        sb.onclick=()=>send({type:'suit', suit:s});
        b.appendChild(sb);
      }
      const pb=document.createElement('button'); pb.className='gold-btn small'; pb.textContent='2 (PASSE)';
      pb.onclick=()=>send({type:'pass'}); b.appendChild(pb);
      root.appendChild(b);
    }
  }

  // ---------- boutons ronds ----------
  if(V.lastTrick){
    const lt=iconBtn('ib-r1','🂠','Dernière main',()=>{ showLast=true; render(); });
    root.appendChild(lt);
  }
  if(!WATCHING){ // un spectateur ne parle pas a la table
    const say=iconBtn('ib-r2','💬','Dire',()=>{ showChat=!showChat; render(); });
    root.appendChild(say);
  }

  // mode spectateur : bandeau discret + bouton pour prendre une chaise (3e position a
  // gauche, sous l'ambiance et le plein ecran : aucune superposition)
  if(WATCHING){
    const badge=document.createElement('div'); badge.className='watch-badge';
    badge.textContent='👀 Tu regardes la partie';
    root.appendChild(badge);
    const chair=iconBtn('ib-l3','🪑','Prendre une place', ()=>send({type:'want-seat'}));
    root.appendChild(chair);
  }
  if(showChat){
    const cb=document.createElement('div'); cb.className='chat-bar';
    for(const ph of PHRASES_FLAT){
      const b=document.createElement('button'); b.textContent=ph;
      b.onclick=()=>{ showChat=false; send({type:'say', text:ph}); render(); };
      cb.appendChild(b);
    }
    root.appendChild(cb);
  }

  // ---------- fin de manche / partie ----------
  if(V.screen==='roundEnd' && V.roundResult){
    const r=V.roundResult;
    const o=overlay(root);
    const attackIsUs=(r.attackTeam===myTeam);
    const gN=r.gained[myTeam], gE=r.gained[1-myTeam];
    let html='<h2>Fin de la manche</h2>';
    if(r.litige){
      html+='<p>⚖ <b>LITIGE — 81 partout !</b><br>Les 81 points du preneur sont remis en jeu à la donne suivante.</p>';
    }else{
      html+='<p>'+(attackIsUs?'Nous avons pris':'Eux ont pris')+' à '+V.trumpSuit+'.<br>'
        +(r.made?'Contrat réussi !':'Contrat chuté !')+'</p>';
      if(r.litigeAdded) html+='<p>⚖ Litige remporté : +'+r.litigeAdded+' points encaissés !</p>';
    }
    if(r.capotTeam!==null) html+='<p>🏆 CAPOT ! +90 points bonus</p>';
    html+='<p><b>Nous : +'+gN+'</b> &nbsp; <b>Eux : +'+gE+'</b></p>';
    o.panel.innerHTML=html;
    const btn=document.createElement('button'); btn.className='gold-btn'; btn.textContent='MANCHE SUIVANTE';
    btn.onclick=()=>send({type:'next'});
    o.panel.appendChild(btn);
  }
  if(V.screen==='gameOver'){
    const o=overlay(root);
    const win = V.scores[myTeam]>=1000;
    o.panel.innerHTML='<h2>Partie terminée !</h2><p>'+(win?'Nous remportons':'Eux remportent')+' la partie 🏆</p>'
      +'<p>Nous : '+V.scores[myTeam]+' — Eux : '+V.scores[1-myTeam]+'</p>';
    const back=document.createElement('button'); back.className='gold-btn'; back.textContent='NOUVELLE PARTIE';
    back.onclick=()=>{
      stopHeartbeat();
      intentionalClose=true;
      try{ ws && ws.close(); }catch(e){}
      sessionStorage.removeItem('belote');
      ws=null; V=null; PLAYERS=null; ME=-1; CODE=null; TOKEN=null; STARTED=false; myName=''; disconnected=false;
      render();
    };
    o.panel.appendChild(back);
  }
  if(showLast && V.lastTrick){
    const o=overlay(root, ()=>{ showLast=false; render(); });
    o.panel.innerHTML='<h2>Dernière main</h2>';
    const cross=document.createElement('div'); cross.className='cross-wrap';
    for(const pl of V.lastTrick){
      const slot=document.createElement('div'); slot.className='cross-slot cross-'+screenSlot(pl.player);
      const who=document.createElement('div'); who.className='who'; who.textContent=nameOf(pl.player);
      slot.appendChild(who); slot.appendChild(cardEl(pl.card));
      cross.appendChild(slot);
    }
    o.panel.appendChild(cross);
    const c=document.createElement('button'); c.className='gold-btn small'; c.textContent='FERMER';
    c.onclick=()=>{ showLast=false; render(); };
    o.panel.appendChild(c);
  }

  // FLIP (2/2) : les cartes sont a leur place finale. On les replace visuellement la ou
  // elles etaient, puis on relache : elles glissent toutes seules vers leur nouvelle
  // position. Les cartes qui descendent de la rangee du dessus se rangent, les anciennes
  // s'ecartent pour leur faire de la place.
  if(flipPending){
    flipPending=false;
    const moved=[];
    root.querySelectorAll('.card[data-cid]').forEach(el=>{
      const a=prevRects.get(el.dataset.cid); if(!a) return;
      const b=el.getBoundingClientRect();
      const dx=a.left-b.left, dy=a.top-b.top;
      if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
      el.style.transition='none';
      el.style.transform='translate('+dx+'px,'+dy+'px)';
      moved.push(el);
    });
    if(moved.length){
      requestAnimationFrame(()=>{
        moved.forEach((el,i)=>{
          el.style.transition='transform 400ms cubic-bezier(.2,.88,.25,1) '+(i*14)+'ms';
          el.style.transform='translate(0,0)';
        });
      });
    }
  }
}

function nameOf(seat){
  if(seat===ME) return 'Toi';
  const p=PLAYERS && PLAYERS.find(x=>x.seat===seat);
  return p ? p.name : 'Joueur';
}
function bar(root, text, buttons){
  const b=document.createElement('div'); b.className='bid-bar';
  const t=document.createElement('div'); t.className='bid-text'; t.textContent=text; b.appendChild(t);
  for(const [label,fn] of buttons){
    const bt=document.createElement('button'); bt.className='gold-btn small'; bt.textContent=label;
    bt.onclick=fn; b.appendChild(bt);
  }
  root.appendChild(b);
}
function iconBtn(pos, icon, title, fn){
  const d=document.createElement('div'); d.className='icon-btn '+pos; d.textContent=icon; d.title=title; d.onclick=fn;
  return d;
}
function overlay(root, onBg){
  const ov=document.createElement('div'); ov.className='overlay';
  if(onBg) ov.onclick=(e)=>{ if(e.target===ov) onBg(); };
  const panel=document.createElement('div'); panel.className='panel';
  ov.appendChild(panel); root.appendChild(ov);
  return {ov, panel};
}

// tentative de reconnexion au chargement
(function(){
  applyTheme();
  const saved=sessionStorage.getItem('belote');
  if(saved){
    try{ const {code,token,name}=JSON.parse(saved);
      if(name) myName=name; // restaure le pseudo pour l'affichage et une reconnexion par nom
      connect(()=>send(token ? {type:'join', code, token} : {type:'join', code, name})); }catch(e){}
  }
  render();
})();
</script>
